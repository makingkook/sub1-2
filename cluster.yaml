apiVersion: eksctl.io/v1alpha5
kind: ClusterConfig

metadata:
  name: unicorn-eks-cluster
  region: ap-northeast-2
  version: "1.35"

iam:
  withOIDC: true

vpc:
  subnets:
    private:
      ap-northeast-2a: { id: subnet-065c6660595d0393e }
      ap-northeast-2b: { id: subnet-0c95dc957d81f81ba }
      ap-northeast-2c: { id: subnet-040a828935f7108e2 }
  clusterEndpoints:
    privateAccess: true
    publicAccess: true   # 생성 후 false로 변경 (아래 명령)

# 추가: Secrets 암호화 (Platform 키)
secretsEncryption:
  keyARN: arn:aws:kms:ap-northeast-2:003150130236:key/mrk-ef7a29c1cbd44ee398c1940ea015cffd

# 추가: 클러스터 로그 5종 전부
cloudWatch:
  clusterLogging:
    enableTypes: ["*"]

# 추가: Pod Identity Agent, CoreDNS는 addon 노드에만
addons:
  - name: vpc-cni
  - name: kube-proxy
  - name: eks-pod-identity-agent
  - name: coredns
    configurationValues: |-
      nodeSelector:
        unicorn: addon

managedNodeGroups:
  - name: unicorn-k8snode-app-ng
    instanceName: unicorn-k8snode-app-node
    instanceType: t3.medium
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    privateNetworking: true
    labels:
      unicorn: app
    volumeEncrypted: true                      # 추가: EBS 암호화
    volumeKmsKeyID: arn:aws:kms:ap-northeast-2:003150130236:key/mrk-ef7a29c1cbd44ee398c1940ea015cffd         # 추가
    preBootstrapCommands:                      # 추가: KST
      - timedatectl set-timezone Asia/Seoul

  - name: unicorn-k8snode-addon-ng
    instanceType: t3.medium
    instanceName: unicorn-k8snode-addon-node
    desiredCapacity: 2
    minSize: 2
    maxSize: 2
    privateNetworking: true
    labels:
      unicorn: addon
    volumeEncrypted: true                      # 추가
    volumeKmsKeyID: arn:aws:kms:ap-northeast-2:003150130236:key/mrk-ef7a29c1cbd44ee398c1940ea015cffd         # 추가
    preBootstrapCommands:                      # 추가
      - timedatectl set-timezone Asia/Seoul