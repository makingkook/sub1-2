apiVersion: v1
kind: ServiceAccount
metadata:
  name: unicorn-app-sa          # cluster.yaml Pod Identity 연결 대상
  namespace: unicorn
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: unicorn-book-app-deploy
  namespace: unicorn
  labels:
    app: book
spec:
  replicas: 2
  selector:
    matchLabels:
      app: book
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxUnavailable: 0
      maxSurge: 1
  template:
    metadata:
      labels:
        app: book
    spec:
      serviceAccountName: unicorn-app-sa
      nodeSelector:
        unicorn: app
      terminationGracePeriodSeconds: 45
      containers:
        - name: book
          image: 003150130236.dkr.ecr.ap-northeast-2.amazonaws.com/unicorn-concert-app:latest
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 8080
          envFrom:
            - configMapRef:
                name: unicorn-config
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 10
            periodSeconds: 10
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 3
            periodSeconds: 5
          lifecycle:
            preStop:
              exec:
                command: ["/bin/sh", "-c", "sleep 15"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              memory: 256Mi
